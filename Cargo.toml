[package]
name = "diffpack-engine"
version = "0.4.1"
edition = "2021"
description = "Fetches, extracts and diffs package archives from crates.io, npm, PyPI, Packagist and Go, as a WebAssembly module."
repository = "git+https://github.com/philfreshman/diffpack-engine.git"

publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "WorkerGlobalScope", "Response", "Headers"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
similar = "3.2"
flate2 = "1.1"
tar = "0.4"
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[[example]]
name = "bench"
test = true

[profile.release]
opt-level = 's'
codegen-units = 1
debug = false
lto = true
panic = "abort"
