name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  WASM_PACK_VERSION: 0.15.0

jobs:
  release:
    name: release to npm and GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: wasm-pack build
        run: wasm-pack build --release --target web --scope philfreshman

      - name: Drop wasm-pack's pkg/.gitignore
        run: rm -f pkg/.gitignore

      - name: Show the tarball
        run: npm pack --dry-run
        working-directory: pkg

      - name: Version, publish to npm, tag and write the GitHub release
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 25
          extra_plugins: |
            @semantic-release/exec@7
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
