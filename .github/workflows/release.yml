name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=wasm-bindgen/wasm-pack extractVersion=^v(?<version>.+)$
  WASM_PACK_VERSION: 0.15.0
  # renovate: datasource=npm depName=@semantic-release/exec
  SEMANTIC_RELEASE_EXEC_VERSION: 7

jobs:
  release:
    name: release to npm and GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: wasm-pack build
        run: wasm-pack build --release --target web --scope philfreshman

      - name: Drop wasm-pack's pkg/.gitignore
        run: rm -f pkg/.gitignore

      - name: Show the tarball
        run: npm pack --dry-run
        working-directory: pkg

      - name: Version, publish to npm, tag and write the GitHub release
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        with:
          semantic_version: 25
          # conventional-changelog-conventionalcommits is kept out of Renovate on purpose: its major must match the
          # conventional-changelog-writer that the pinned semantic-release ships (semantic-release 25 ships writer 8, which needs preset 9).
          extra_plugins: |
            @semantic-release/exec@${{ env.SEMANTIC_RELEASE_EXEC_VERSION }}
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
